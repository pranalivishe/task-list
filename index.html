<div>
    <form><lable> Task Name </lable>
        <input type="" name = "taskname" id= "TaskName"/>
<br><br>
        <lable>status</lable>
        <input type="text" name  = "status" id= "status"/>
<br><br>
        <button id="submitButton"> submit</button>
    </form>

    <ul id="taskList"></ul>
</div>
        </body>
    <script>
//Javascript Code to practice.
//Data Types




//Variables



//Arithenmatic Operations


//Array and functions


//Functions



//DOM manipulation
//Document Object Model
const tasks = [];

const submitButton = document.getElementById("submitButton");
const taskList = document.querySelector("#taskList");

// ADD THESE
const taskName = document.getElementById("TaskName");
const status = document.getElementById("status");

//Events
submitButton.addEventListener("click",(e)=>{
    e.preventDefault();

    const task = {
        name : taskName.value,stat: status.value
    };

    tasks.push(task);

    renderTasklist();

    taskName.value = "";
    status.value = "";

    alert("Form Submitted");
});

  function renderTasklist(){
    const li = document.createElement("li");

    tasks.forEach(task =>  {
        li.textContent = task.name + " - " + task.stat;
    });

    taskList.append(li);
  }
    </script>
