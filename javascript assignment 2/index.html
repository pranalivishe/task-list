<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 2: Student Registration</title>
    <style>
        /* CSS Requirements: Center the form on the page and add basic spacing */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        .form-container {
            width: 350px;
            padding: 20px;
            border: 1px solid #000000;
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        /* Style input fields and spacing */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }

        input, textarea, select {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #777777;
        }

        /* Style button and add hover effect */
        button {
            width: 100%;
            padding: 10px;
            background-color: #333333;
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #000000; /* Simple hover darkens the button */
        }

        /* Display errors and success messages clearly */
        .error-msg {
            color: #cc0000;
            font-size: 0.9em;
            margin-top: 4px;
            display: block;
        }

        .success-msg {
            color: #008800;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Student Registration Form</h2>
        
        <form id="registrationForm">
            <!-- Full Name -->
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" id="fullName">
                <span class="error-msg" id="nameError"></span>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email:</label>
                <input type="text" id="email">
                <span class="error-msg" id="emailError"></span>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label>Phone Number:</label>
                <input type="text" id="phone">
                <span class="error-msg" id="phoneError"></span>
            </div>

            <!-- Date of Birth -->
            <div class="form-group">
                <label>Date of Birth:</label>
                <input type="date" id="dob">
                <span class="error-msg" id="dobError"></span>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender:</label>
                <select id="gender">
                    <option value="">-- Select --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <span class="error-msg" id="genderError"></span>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password">
                <span class="error-msg" id="passError"></span>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label>Confirm Password:</label>
                <input type="password" id="confirmPassword">
                <span class="error-msg" id="confirmError"></span>
            </div>

            <!-- Address -->
            <div class="form-group">
                <label>Address:</label>
                <textarea id="address" rows="3"></textarea>
                <span class="error-msg" id="addressError"></span>
            </div>

            <!-- Submit Button -->
            <button type="submit">Submit</button>
        </form>

        <!-- Success Message Placeholder -->
        <div class="success-msg" id="successMessage"></div>
    </div>

    <script>
        document.getElementById("registrationForm").addEventListener("submit", function(event) {
            // Stop the form from reloading the browser page
            event.preventDefault();

            // Clear out any old error and success messages
            var errors = document.getElementsByClassName("error-msg");
            for (var i = 0; i < errors.length; i++) {
                errors[i].textContent = "";
            }
            document.getElementById("successMessage").textContent = "";

            // Get all input field values
            var name = document.getElementById("fullName").value.trim();
            var email = document.getElementById("email").value.trim();
            var phone = document.getElementById("phone").value.trim();
            var dob = document.getElementById("dob").value;
            var gender = document.getElementById("gender").value;
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirmPassword").value;
            var address = document.getElementById("address").value.trim();

            var isValid = true;

            // 1. Check all required fields are filled
            if (name === "") { document.getElementById("nameError").textContent = "Full name is required."; isValid = false; }
            if (email === "") { document.getElementById("emailError").textContent = "Email is required."; isValid = false; }
            if (phone === "") { document.getElementById("phoneError").textContent = "Phone number is required."; isValid = false; }
            if (dob === "") { document.getElementById("dobError").textContent = "Date of birth is required."; isValid = false; }
            if (gender === "") { document.getElementById("genderError").textContent = "Gender selection is required."; isValid = false; }
            if (password === "") { document.getElementById("passError").textContent = "Password is required."; isValid = false; }
            if (confirmPassword === "") { document.getElementById("confirmError").textContent = "Please confirm your password."; isValid = false; }
            if (address === "") { document.getElementById("addressError").textContent = "Address is required."; isValid = false; }

            // 2. Validate Email Format (using standard pattern check)
            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email !== "" && !emailPattern.test(email)) {
                document.getElementById("emailError").textContent = "Invalid email format (e.g. name@email.com).";
                isValid = false;
            }

            // 3. Validate Phone Number (must be exactly 10 numeric digits)
            var phonePattern = /^[0-9]{10}$/;
            if (phone !== "" && !phonePattern.test(phone)) {
                document.getElementById("phoneError").textContent = "Phone number must be exactly 10 digits.";
                isValid = false;
            }

            // 4. Check Password and Confirm Password are identical
            if (password !== "" && confirmPassword !== "" && password !== confirmPassword) {
                document.getElementById("confirmError").textContent = "Passwords do not match.";
                isValid = false;
            }

            // 6. If all details pass validation checks
            if (isValid) {
                document.getElementById("successMessage").textContent = "Registration Successful!";
            }
        });
    </script>

</body>
</html>
